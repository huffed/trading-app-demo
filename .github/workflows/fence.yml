# The live-path fence on GitHub (docs/decisions/0015). The Claude Code hooks refuse edits to the trading code inside
# a session; this job fails a pull request into dev that changes it (a path in .claude/hooks/live-paths.txt), unless
# review/VERDICT.md is already on dev and the title carries the marker CLAUDE.md quotes.
#
# It runs on pull_request_target, so this file, the script and live-paths.txt are the default branch's (dev's)
# copies, not the PR's: a PR cannot switch its own check off. From 2026-12-02 GitHub runs that trigger in a public
# repository only where an Actions event policy allows it (decision 0015 has the call). It never checks out, fetches
# or runs the PR's code: the changed files come from the API, and the title reaches the script only through env.
# A re-run re-reads the original event (its title, its dev); edit the title or push to decide again.
name: fence
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: fence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  live-paths:
    name: live-path fence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check out dev (pull_request_target's default ref, the default branch; never the PR's head)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: list the files the PR changes, from the API (a rename gives its old name too; a deletion its path)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/pr-files.json"
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .changed_files > "$RUNNER_TEMP/pr-changed-files.txt"
      - name: fail on a fenced path unless review/VERDICT.md is on dev and the title has the marker
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/ci/live-path-fence.sh . "$RUNNER_TEMP/pr-files.json" "$(cat "$RUNNER_TEMP/pr-changed-files.txt")"
