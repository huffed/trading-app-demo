# Dead-man switch for the trading pipeline (2026-06-10).
#
# The whole stack runs on the operator's Mac (cron → pnpm dev → Supabase).
# When any link dies, ticks stop SILENTLY — the 2026-05-24 outage went
# unnoticed for 17 days and Supabase's free tier auto-paused the project
# from zero traffic. This check inverts that: GitHub (independent infra)
# verifies every 30 min that a manage_tick reached the database recently,
# and FAILS when the trail goes stale — GitHub emails the repo owner on
# scheduled-workflow failure, so a dead Mac/server/cron/DB alerts within
# ~45-60 min with zero third-party accounts.
#
# Depends on the `public.last_manage_tick()` SECURITY DEFINER function
# (anon-executable, exposes ONE timestamp and nothing else — RLS keeps
# everything else closed). Secrets: SUPABASE_URL + SUPABASE_ANON_KEY
# (encrypted repo secrets; nothing sensitive lives in this file — the
# repo is public).
#
# NOTE: GitHub disables scheduled workflows after 60 days without repo
# activity. This repo sees regular commits; if development ever pauses
# that long, re-enable under Actions → dead-man-switch.
name: dead-man-switch
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  check-heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Verify manage_tick freshness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAX_AGE_MINUTES: "45" # manage tick cadence is 5 min; 45 = ~9 missed ticks
        run: |
          set -euo pipefail
          ts=$(curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/last_manage_tick" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}' | tr -d '"')
          if [ -z "$ts" ] || [ "$ts" = "null" ]; then
            echo "::error::No manage_tick found at all — pipeline has never ticked or DB is unreachable."
            exit 1
          fi
          now_epoch=$(date -u +%s)
          tick_epoch=$(date -u -d "$ts" +%s)
          age_min=$(( (now_epoch - tick_epoch) / 60 ))
          echo "Last manage_tick: $ts (${age_min}m ago, threshold ${MAX_AGE_MINUTES}m)"
          if [ "$age_min" -gt "$MAX_AGE_MINUTES" ]; then
            echo "::error::Trading pipeline heartbeat STALE: last manage_tick ${age_min}m ago (> ${MAX_AGE_MINUTES}m). Mac asleep, dev server down, cron dead, or Supabase paused."
            exit 1
          fi
          echo "Pipeline alive."

  # Scan freshness — separate from manage_tick because the scan cron and
  # manage cron are independent launchd/cron entries; either can die
  # without the other. 2026-06-15: scan cron silently stopped at 18:45 UTC
  # while manage_tick kept firing every 5 min, so the heartbeat dead-man
  # stayed green; the flagship missed its 20:00 UTC 4h bar-close LLM
  # evaluation. Depends on the `public.last_scan_tick()` RPC (migration
  # 00041). Threshold 35m = 2.3× the 15-min scan cadence: tight enough
  # to catch two consecutive misses, loose enough to tolerate one
  # transient blip plus scheduling jitter.
  check-scan-tick:
    runs-on: ubuntu-latest
    steps:
      - name: Verify scan_completed freshness
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          MAX_AGE_MINUTES: "35" # scan cadence is 15 min; 35 = 2 missed ticks + jitter
        run: |
          set -euo pipefail
          ts=$(curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/last_scan_tick" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}' | tr -d '"')
          if [ -z "$ts" ] || [ "$ts" = "null" ]; then
            echo "::error::No scan_completed found at all — scan cron has never ticked or DB is unreachable."
            exit 1
          fi
          now_epoch=$(date -u +%s)
          tick_epoch=$(date -u -d "$ts" +%s)
          age_min=$(( (now_epoch - tick_epoch) / 60 ))
          echo "Last scan_completed: $ts (${age_min}m ago, threshold ${MAX_AGE_MINUTES}m)"
          if [ "$age_min" -gt "$MAX_AGE_MINUTES" ]; then
            echo "::error::Scan cron heartbeat STALE: last scan_completed ${age_min}m ago (> ${MAX_AGE_MINUTES}m). Scan cron entry dead, dev server down, or scan route erroring. Manage cron can stay green while this fails — bar-close LLM evaluations are silently missed."
            exit 1
          fi
          echo "Scan cron alive."

  # Broker-API availability (added 2026-06-11 after MetaApi's client-API
  # tier black-holed globally — every regional endpoint TCP-timeout while
  # our pipeline stayed green; nothing alerted because the dead-man only
  # watched OUR links). Unauthenticated probe: 2xx-4xx counts as alive
  # (401/404 fine — we're testing availability, not auth); a connect
  # timeout OR 5xx on two attempts 30s apart fails (the same outage's
  # recovery phase served persistent 503s — mirroring is just as dead
  # then). Distinct job name so the failure email says which alarm
  # fired. Runs unconditionally — broker downtime matters even in paper
  # mode because mirroring is the next step after every config change.
  check-broker-api:
    runs-on: ubuntu-latest
    steps:
      - name: Verify MetaApi client API availability (london)
        run: |
          set -uo pipefail
          probe() {
            curl -s -o /dev/null -w "%{http_code}" -m 15 \
              "https://mt-client-api-v1.london.agiliumtrade.ai/health" 2>/dev/null || echo "000"
          }
          bad() { [ "$1" = "000" ] || [ "$1" -ge 500 ] 2>/dev/null; }
          code=$(probe)
          if bad "$code"; then
            echo "First attempt: HTTP $code — retrying in 30s (transient-blip guard)"
            sleep 30
            code=$(probe)
          fi
          echo "MetaApi london client API → HTTP $code"
          if bad "$code"; then
            echo "::error::MetaApi client API DOWN (london, HTTP $code on two attempts). Broker mirroring is dead even if the local pipeline is green — like the 2026-06-11 global MetaApi outage."
            exit 1
          fi
          echo "Broker API available."
