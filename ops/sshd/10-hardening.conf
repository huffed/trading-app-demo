# /etc/ssh/sshd_config.d/10-hardening.conf — as installed on 2026-10-29 (docs/runbooks/harden-vps-ssh.md).
# Sorts before 50-cloud-init.conf, so these values win. Only `ops` may log in, keys only.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
AllowUsers ops
MaxAuthTries 3
X11Forwarding no
LoginGraceTime 30
